name: public-leak-guard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: github.repository == 'AiDog-im/AiDog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact public revision
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Scan the exported tree
        if: steps.checkout.outcome == 'success'
        id: scan
        run: |
          rc=0
          python3 .github/scripts/leak_scan.py || rc=$?
          echo "code=$rc" >> "$GITHUB_OUTPUT"

      - name: Report result for this revision
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SCAN_CODE: ${{ steps.scan.outputs.code }}
        run: |
          if [ "$CHECKOUT" != success ]; then
            verdict='Checkout failed'
          else
            case "$SCAN_CODE" in
              0) verdict=Clean ;;
              3) verdict='Confirmed finding. Exporter review required' ;;
              *) verdict='Scanner failed' ;;
            esac
          fi
          printf '## %s

Commit: \x60%s\x60
' "$verdict" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" != Clean ]; then
            echo "::error::$verdict ($GITHUB_SHA)"
            exit 1
          fi
